<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slashbot Chat</title>

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- highlight.js CSS theme -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
  />

  <!-- App styles -->
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden">

  <main class="flex flex-col h-full max-w-3xl w-full mx-auto">
    <div x-data="chat()" class="flex flex-col h-full relative">

      <!-- Header -->
      <header class="flex-shrink-0 flex items-center justify-between px-4 py-3 border-b border-gray-800 bg-gray-950">
        <h1 class="text-lg font-semibold text-gray-100">Slashbot</h1>
        <button
          @click="showTokenPrompt = true"
          class="text-xs text-gray-400 hover:text-gray-200 transition-colors px-2 py-1 rounded border border-gray-700 hover:border-gray-500"
          title="Configure API token"
        >
          Token
        </button>
      </header>

      <!-- Token input overlay -->
      <div
        x-show="showTokenPrompt"
        x-transition
        class="absolute inset-0 z-50 flex items-center justify-center bg-gray-950/90 backdrop-blur-sm"
        role="dialog"
        aria-modal="true"
        aria-label="Enter API token"
      >
        <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full max-w-sm mx-4 shadow-2xl">
          <h2 class="text-base font-semibold text-gray-100 mb-1">Authentication</h2>
          <p class="text-sm text-gray-400 mb-4">Enter your Slashbot API token to continue.</p>
          <form @submit.prevent="saveToken($refs.tokenInput.value)" novalidate>
            <label for="token-input" class="block text-xs text-gray-400 mb-1">API Token</label>
            <input
              id="token-input"
              x-ref="tokenInput"
              :value="token"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••••••••••"
              class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 mb-3"
            />
            <button
              type="submit"
              class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900"
            >
              Save Token
            </button>
          </form>
        </div>
      </div>

      <!-- Global error banner -->
      <div
        x-show="error && !isStreaming"
        x-transition
        class="flex-shrink-0 mx-4 mt-2 px-3 py-2 bg-red-900/60 border border-red-700 rounded-lg text-sm text-red-300"
        role="alert"
        aria-live="polite"
      >
        <span x-text="error"></span>
        <button @click="error = null" class="ml-2 text-red-400 hover:text-red-200" aria-label="Dismiss error">&times;</button>
      </div>

      <!-- Message area -->
      <div
        x-ref="messageArea"
        class="flex-1 overflow-y-auto px-4 py-4 space-y-4"
        @scroll="isUserScrolledUp = ($el.scrollHeight - $el.scrollTop - $el.clientHeight) > 50"
        aria-live="polite"
        aria-label="Chat messages"
        role="log"
      >

        <!-- Empty state -->
        <div
          x-show="messages.length === 0"
          class="flex flex-col items-center justify-center h-full text-center py-16 select-none"
        >
          <div class="text-4xl mb-4">🤖</div>
          <p class="text-gray-400 text-sm">Send a message to start chatting.</p>
        </div>

        <!-- Messages loop -->
        <template x-for="msg in messages" :key="msg.id">
          <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">

            <!-- User message -->
            <template x-if="msg.role === 'user'">
              <div class="max-w-[80%]">
                <div class="bg-blue-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 text-sm leading-relaxed whitespace-pre-wrap break-words">
                  <span x-text="msg.parts[0] && msg.parts[0].text"></span>
                </div>
              </div>
            </template>

            <!-- Assistant message -->
            <template x-if="msg.role === 'assistant'">
              <div class="max-w-[85%] flex flex-col gap-1">

                <!-- Thinking indicator: no parts yet, still streaming -->
                <div
                  x-show="msg.isStreaming && msg.parts.length === 0"
                  class="bg-gray-800 border border-gray-700 rounded-2xl rounded-tl-sm px-4 py-3"
                  aria-live="polite"
                  aria-label="Thinking"
                >
                  <!-- Animated dots (hidden when prefers-reduced-motion) -->
                  <div class="thinking-dots flex items-center gap-1.5" aria-hidden="true">
                    <span class="thinking-dot w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                    <span class="thinking-dot w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                    <span class="thinking-dot w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                  </div>
                  <!-- Static fallback for prefers-reduced-motion -->
                  <span class="thinking-static text-sm text-gray-400">Thinking...</span>
                </div>

                <!-- Parts rendering -->
                <template x-if="msg.parts.length > 0">
                  <div class="bg-gray-800 border border-gray-700 rounded-2xl rounded-tl-sm px-4 py-3 flex flex-col gap-3">

                    <template x-for="(part, partIdx) in msg.parts" :key="partIdx">
                      <div>

                        <!-- Text part -->
                        <template x-if="part.type === 'text'">
                          <div>
                            <!-- During streaming: show raw text -->
                            <div
                              x-show="msg.isStreaming || !part.html"
                              class="text-sm text-gray-100 leading-relaxed whitespace-pre-wrap break-words"
                              x-text="part.text"
                            ></div>
                            <!-- After streaming: show rendered HTML -->
                            <div
                              x-show="!msg.isStreaming && part.html"
                              class="prose prose-invert prose-sm max-w-none text-gray-100"
                              x-html="part.html || ''"
                            ></div>
                          </div>
                        </template>

                        <!-- Tool call part -->
                        <template x-if="part.type === 'tool-call'">
                          <div class="rounded-lg border overflow-hidden"
                            :class="{
                              'border-yellow-700/60 bg-yellow-950/30': part.status === 'running',
                              'border-green-700/60 bg-green-950/20': part.status === 'done',
                              'border-red-700/60 bg-red-950/20': part.status === 'error',
                            }"
                          >
                            <!-- Tool call header -->
                            <button
                              class="w-full flex items-center gap-2 px-3 py-2 text-left focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
                              @click="part.expanded = !part.expanded"
                              @keydown.enter.prevent="part.expanded = !part.expanded"
                              @keydown.space.prevent="part.expanded = !part.expanded"
                              :aria-expanded="part.expanded"
                              :aria-label="'Tool call: ' + part.toolName + ', status: ' + part.status"
                            >
                              <!-- Status icon -->
                              <span x-show="part.status === 'running'" class="flex-shrink-0" aria-hidden="true">
                                <svg class="w-4 h-4 text-yellow-400 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                </svg>
                              </span>
                              <span x-show="part.status === 'done'" class="flex-shrink-0 text-green-400" aria-hidden="true">
                                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                </svg>
                              </span>
                              <span x-show="part.status === 'error'" class="flex-shrink-0 text-red-400" aria-hidden="true">
                                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                              </span>

                              <!-- Tool name -->
                              <span class="flex-1 text-xs font-mono font-medium"
                                :class="{
                                  'text-yellow-300': part.status === 'running',
                                  'text-green-300': part.status === 'done',
                                  'text-red-300': part.status === 'error',
                                }"
                                x-text="part.toolName"
                              ></span>

                              <!-- Status label -->
                              <span class="text-xs"
                                :class="{
                                  'text-yellow-500': part.status === 'running',
                                  'text-green-500': part.status === 'done',
                                  'text-red-500': part.status === 'error',
                                }"
                                x-text="part.status === 'running' ? 'Running...' : part.status === 'done' ? 'Done' : 'Error'"
                              ></span>

                              <!-- Expand/collapse chevron -->
                              <span class="flex-shrink-0 text-gray-500 ml-1" aria-hidden="true">
                                <svg class="w-3.5 h-3.5 transition-transform duration-150"
                                  :class="{ 'rotate-180': part.expanded }"
                                  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                              </span>
                            </button>

                            <!-- Tool call body -->
                            <div
                              x-show="part.expanded"
                              x-transition:enter="transition ease-out duration-150"
                              x-transition:enter-start="opacity-0 -translate-y-1"
                              x-transition:enter-end="opacity-100 translate-y-0"
                              x-transition:leave="transition ease-in duration-100"
                              x-transition:leave-start="opacity-100 translate-y-0"
                              x-transition:leave-end="opacity-0 -translate-y-1"
                              class="px-3 pb-3 flex flex-col gap-2"
                            >
                              <!-- Arguments -->
                              <template x-if="part.args && Object.keys(part.args).length > 0">
                                <div>
                                  <div class="text-xs text-gray-500 mb-1 uppercase tracking-wide font-medium">Parameters</div>
                                  <div x-data="{ showFullArgs: false }" class="text-xs font-mono text-gray-300 bg-gray-900/60 rounded p-2 overflow-x-auto">
                                    <template x-if="!showFullArgs">
                                      <div>
                                        <span x-text="truncateText(formatJson(part.args), 500).text"></span>
                                        <button
                                          x-show="truncateText(formatJson(part.args), 500).isTruncated"
                                          @click="showFullArgs = true"
                                          class="ml-1 text-blue-400 hover:text-blue-300 underline"
                                        >show more</button>
                                      </div>
                                    </template>
                                    <template x-if="showFullArgs">
                                      <div>
                                        <span x-text="formatJson(part.args)"></span>
                                        <button @click="showFullArgs = false" class="ml-1 text-blue-400 hover:text-blue-300 underline">show less</button>
                                      </div>
                                    </template>
                                  </div>
                                </div>
                              </template>

                              <!-- Result -->
                              <template x-if="part.result !== null && part.result !== undefined">
                                <div>
                                  <div class="text-xs text-gray-500 mb-1 uppercase tracking-wide font-medium">Result</div>
                                  <div x-data="{ showFullResult: false }" class="text-xs font-mono text-gray-300 bg-gray-900/60 rounded p-2 overflow-x-auto">
                                    <template x-if="!showFullResult">
                                      <div>
                                        <span x-text="truncateText(typeof part.result === 'string' ? part.result : formatJson(part.result), 1000).text"></span>
                                        <button
                                          x-show="truncateText(typeof part.result === 'string' ? part.result : formatJson(part.result), 1000).isTruncated"
                                          @click="showFullResult = true"
                                          class="ml-1 text-blue-400 hover:text-blue-300 underline"
                                        >show more</button>
                                      </div>
                                    </template>
                                    <template x-if="showFullResult">
                                      <div>
                                        <span x-text="typeof part.result === 'string' ? part.result : formatJson(part.result)"></span>
                                        <button @click="showFullResult = false" class="ml-1 text-blue-400 hover:text-blue-300 underline">show less</button>
                                      </div>
                                    </template>
                                  </div>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>

                      </div>
                    </template>

                    <!-- Streaming cursor -->
                    <span
                      x-show="msg.isStreaming && msg.parts.length > 0"
                      class="inline-block w-0.5 h-4 bg-gray-300 animate-pulse align-middle ml-0.5"
                      aria-hidden="true"
                    ></span>

                  </div>
                </template>

                <!-- Message error -->
                <div
                  x-show="msg.error"
                  class="text-xs text-red-400 mt-1"
                  role="alert"
                  x-text="msg.error"
                ></div>

              </div>
            </template>

          </div>
        </template>

      </div>

      <!-- Input area -->
      <div class="flex-shrink-0 border-t border-gray-800 bg-gray-950 px-4 py-3">
        <form
          class="flex items-end gap-2"
          aria-label="Chat input"
          @submit.prevent="sendMessage()"
        >
          <textarea
            x-model="inputText"
            :disabled="isStreaming"
            placeholder="Message Slashbot…"
            rows="1"
            class="flex-1 bg-gray-800 border border-gray-600 rounded-xl px-3 py-2.5 text-sm text-gray-100 placeholder-gray-500 resize-none overflow-hidden focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed leading-relaxed"
            style="max-height: 160px; overflow-y: auto;"
            @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); sendMessage(); }"
            @input="$el.style.height = 'auto'; $el.style.height = Math.min($el.scrollHeight, 160) + 'px'"
            aria-label="Message input"
          ></textarea>

          <button
            type="submit"
            :disabled="isStreaming || !inputText.trim()"
            class="flex-shrink-0 w-11 h-11 flex items-center justify-center bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:cursor-not-allowed text-white rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-950"
            aria-label="Send message"
          >
            <!-- Send icon -->
            <svg x-show="!isStreaming" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
            </svg>
            <!-- Spinner icon when streaming -->
            <svg x-show="isStreaming" class="w-5 h-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- DOMPurify (XSS sanitisation for marked output) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

  <!-- App scripts -->
  <script src="js/sse-client.js"></script>
  <script src="js/chat.js"></script>

  <!-- Alpine.js (must load last, after component definitions) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
